# Settings come from environment variables. For local development they can
# also live in a .env file in the repo root (see .env.example), which is
# imported below; real environment variables take precedence.
spring:
  application:
    name: equiptrack
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/equiptrack}
    username: ${DB_USERNAME:equiptrack}
    password: ${DB_PASSWORD}
  web:
    resources:
      add-mappings: false # WebConfig serves the React app and its client-side routes
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50 # load related rows for lists in batches
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

# Everything the backend answers lives under /api; the React app is served at /
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /api/v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET}         # at least 32 bytes (256 bits)
    ttl: 8h
  mrn:
    hash-key: ${MRN_HASH_KEY}     # HMAC key for hashing full MRNs
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  login:
    max-failed-attempts: 5
    lock-duration: 15m
  timezone: ${APP_TIMEZONE:Europe/Dublin}  # the hospital's zone: "today", due dates, times shown
  equipment:
    return-location: OT store     # where returned items go (a location name)
  home:
    unseen-days: 7                # "Unseen items" task threshold

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # Dev-only seed data lives in its own folder so prod never loads it.
    # Seeds are numbered Vn_1 so they run after migration n and before n+1.
    locations: classpath:db/migration,classpath:db/dev-seed
    placeholders:
      mrn_hash_key: ${app.mrn.hash-key}
      app_timezone: ${app.timezone}

---
# Production (Azure App Service). Every value comes from App Service settings
# or Key Vault; see docs/DEPLOYMENT.md.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}           # Azure Postgres needs ?sslmode=require
    username: ${DB_USERNAME}
server:
  forward-headers-strategy: framework # behind Azure's HTTPS front end
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
