# Publishes the CareTrack demo (sample data, no backend, no database) to Azure
# Static Web Apps on every push to main. Setup: docs/DEMO.md
name: Demo site (Azure Static Web Apps)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: Build and publish the demo
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the demo (sample data built in)
        run: |
          npm ci
          npm run build:demo

      # Skipped until the Static Web App's deployment token is added as a secret
      - name: Publish to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
