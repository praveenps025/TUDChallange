# Builds the CareTrack demo (sample data, no backend, no database) and deploys
# it to the Azure Web App "equipment" (Java SE). The demo is packaged with a
# tiny JDK-only web server (demo-server/DemoServer.java) into one jar, which
# App Service runs like any Java app. Created by Azure's Deployment Center and
# adapted for this repository; the sign-in secrets are the ones Azure added.
#
# To deploy the full app later (needs a database, see docs/DEPLOYMENT.md),
# replace the build job with the build in build-and-deploy.yml and deploy
# backend/target/equiptrack.jar instead.
name: Build and deploy JAR app to Azure Web App - equipment

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the demo (sample data built in)
        run: |
          npm ci
          npm run build:demo

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Package the demo into a runnable jar
        run: |
          javac -d demo-build demo-server/DemoServer.java
          cp -r dist demo-build/site
          jar --create --file caretrack-demo.jar --main-class DemoServer -C demo-build .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: caretrack-demo.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9DE84F33DBFF417DAC00E25AFF92DB58 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_223B22743B7F45B98CC70D3D7E3F02A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5E8DB410719419CA12CBE6309301E4A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'equipment'
          slot-name: 'Production'
          package: 'caretrack-demo.jar'
